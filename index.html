<script>
  // Apply saved language before first paint (prevents a direction flash)
  (function () {
    try {
      var l = localStorage.getItem('das27.lang');
      if (l === 'en' || l === 'ar') {
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      }
    } catch (e) {}
    if (location.search.indexOf('nointro') > -1) document.documentElement.classList.add('no-intro');
  })();
</script>
